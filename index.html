<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> To-Do List App</title>
    <link rel="stylesheet" href="css/style.css">
   <link rel="icon" type="images/png" href="image/empty.jpg"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
            <h2 class="head">
                📆 To-Do List APP
            </h2>
            <div class="create-todo">
                <input onkeypress="enterkey(event)" type="text" id="inputTodo" placeholder="Add some todo..🧐">
                <button onclick="addTodo()">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <div class="task-list">
                 <!-- <div class="task">
                    <button onclick="checkBtn(this)"class="check-btn">
                        <i class="fa-solid fa-check"></i>
                    </button>
                    <span onclick="checkBtn(this)">${inputTodo.value}</span>
                    <button onclick="deleteBtn(this)"class="delete-btn">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div> -->
            </div>

            <div class="footer">
                <span>You have <span id="countPendingTasks">0</span> Pending tasks</span>
                <button onclick="clearAll()">Clear All</button>
            </div>
    </div>
</body>
<script src="script.js"></script>
</html>
